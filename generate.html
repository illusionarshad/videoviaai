<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio — VideoViaAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .studio-wrapper {
      flex: 1;
      padding: 7.5rem 0 4rem;
    }

    .studio-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .studio-header h1 {
      font-size: clamp(1.85rem, 3.5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .usage-pill {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .usage-pill strong {
      color: var(--text-primary);
    }

    .studio-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 2rem;
      align-items: start;
    }

    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 0.25rem;
      margin-bottom: 1.5rem;
    }

    .mode-tab {
      padding: 0.55rem;
      border: none;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: #ffffff;
      color: #000000;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 0.45rem;
    }

    .prompt-box,
    .select-input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.94rem;
      outline: none;
    }

    .prompt-box {
      min-height: 130px;
      resize: vertical;
      line-height: 1.55;
    }

    .prompt-box:focus,
    .select-input:focus {
      border-color: var(--border-hover);
    }

    .generate-btn {
      width: 100%;
      padding: 0.9rem;
      font-weight: 600;
      font-size: 0.96rem;
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .output-box {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg-elevated);
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .output-placeholder {
      color: var(--text-muted);
      font-size: 0.92rem;
      max-width: 320px;
      line-height: 1.6;
    }

    .output-image {
      display: none;
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .spinner {
      display: none;
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .output-actions {
      display: none;
      margin-top: 1.25rem;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .error-banner {
      display: none;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
      font-size: 0.86rem;
      line-height: 1.5;
    }

    @media (max-width: 860px) {
      .studio-grid {
        grid-template-columns: 1fr;
      }
      .output-box {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-dot"></span>
      VideoViaAI
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="generate.html" style="color: #ffffff;">Studio</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-secondary">Sign in</a>
      <a href="pricing.html" class="btn btn-primary">Upgrade</a>
    </div>
  </nav>

  <main class="studio-wrapper">
    <div class="container">
      <div class="studio-header">
        <div>
          <h1>AI Creative <span class="iridescent-text">Studio</span></h1>
        </div>
        <div class="usage-pill" id="usage-pill">
          Free daily images left: <strong id="images-left">2</strong> / 2
        </div>
      </div>

      <div class="studio-grid">
        <!-- Left: Controls -->
        <div class="panel">
          <div class="mode-tabs">
            <button type="button" class="mode-tab active" data-mode="image">Text to Image</button>
            <button type="button" class="mode-tab" data-mode="video">Text to Video</button>
          </div>

          <div class="form-group">
            <label for="prompt-input">Describe what you want to create</label>
            <textarea
              id="prompt-input"
              class="prompt-box"
              placeholder="Example: A cinematic shot of a futuristic neon city in the rain, ultra detailed, 8k..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="style-select">Visual Style</label>
            <select id="style-select" class="select-input">
              <option value="">Default (Natural)</option>
              <option value=", cinematic lighting, photorealistic, 8k">Photorealistic</option>
              <option value=", vibrant anime style, studio quality">Anime</option>
              <option value=", 3D Pixar style render, soft lighting">3D Render</option>
              <option value=", digital concept art, dramatic atmosphere">Digital Art</option>
            </select>
          </div>

          <button type="button" class="btn btn-primary generate-btn" id="generate-btn">
            Generate Image
          </button>

          <div class="error-banner" id="error-banner"></div>
        </div>

        <!-- Right: Output -->
        <div class="panel">
          <div class="output-box" id="output-box">
            <div class="spinner" id="spinner"></div>
            <p class="output-placeholder" id="output-placeholder">
              Your generated creation will appear here. Type a prompt on the left and click Generate.
            </p>
            <img id="output-image" class="output-image" alt="Generated AI artwork" />
          </div>

          <div class="output-actions" id="output-actions">
            <span style="font-size: 0.85rem; color: var(--text-secondary);">Ready to save</span>
            <a id="download-btn" class="btn btn-primary" download="videoviaai-image.png">Download Image</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span>© 2026 VideoViaAI. All rights reserved.</span>
        <div style="display: flex; gap: 1.5rem;">
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const API_URL = "https://videoviaai-api.illusionarshad.workers.dev/";
    const DAILY_IMAGE_LIMIT = 2;

    let currentMode = "image";
    let currentImageUrl = null;

    const promptInput = document.getElementById("prompt-input");
    const styleSelect = document.getElementById("style-select");
    const generateBtn = document.getElementById("generate-btn");
    const errorBanner = document.getElementById("error-banner");
    const spinner = document.getElementById("spinner");
    const placeholder = document.getElementById("output-placeholder");
    const outputImage = document.getElementById("output-image");
    const outputActions = document.getElementById("output-actions");
    const downloadBtn = document.getElementById("download-btn");
    const imagesLeftEl = document.getElementById("images-left");

    function getTodayKey() {
      return "vvai_usage_" + new Date().toISOString().slice(0, 10);
    }

    function getUsedCount() {
      return parseInt(localStorage.getItem(getTodayKey()) || "0", 10);
    }

    function updateUsageDisplay() {
      const remaining = Math.max(0, DAILY_IMAGE_LIMIT - getUsedCount());
      imagesLeftEl.textContent = remaining;
    }

    updateUsageDisplay();

    // Switch between Image and Video tabs
    document.querySelectorAll(".mode-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".mode-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        currentMode = tab.dataset.mode;
        errorBanner.style.display = "none";

        if (currentMode === "video") {
          generateBtn.textContent = "Generate Video";
        } else {
          generateBtn.textContent = "Generate Image";
        }
      });
    });

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    generateBtn.addEventListener("click", async () => {
      errorBanner.style.display = "none";
      const rawPrompt = promptInput.value.trim();

      if (!rawPrompt) {
        showError("Please enter a description first.");
        return;
      }

      if (currentMode === "video") {
        showError("Text-to-Video engine is coming soon! Switch to 'Text to Image' to generate right now.");
        return;
      }

      if (getUsedCount() >= DAILY_IMAGE_LIMIT) {
        showError("You've reached your 2 free images for today. Come back tomorrow or upgrade on the Pricing page!");
        return;
      }

      const fullPrompt = rawPrompt + styleSelect.value;

      // Loading state
      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";
      outputImage.style.display = "none";
      outputActions.style.display = "none";
      spinner.style.display = "block";
      placeholder.style.display = "block";
      placeholder.textContent = "Creating your image... this usually takes 5 to 15 seconds.";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: fullPrompt }),
        });

        if (!response.ok) {
          let errMsg = "Something went wrong. Please try again.";
          try {
            const errData = await response.json();
            if (errData.error) errMsg = errData.error;
          } catch (_) {}
          throw new Error(errMsg);
        }

        const blob = await response.blob();
        if (currentImageUrl) URL.revokeObjectURL(currentImageUrl);
        currentImageUrl = URL.createObjectURL(blob);

        outputImage.src = currentImageUrl;
        outputImage.style.display = "block";
        placeholder.style.display = "none";
        downloadBtn.href = currentImageUrl;
        outputActions.style.display = "flex";

        // Update daily free count
        localStorage.setItem(getTodayKey(), String(getUsedCount() + 1));
        updateUsageDisplay();
      } catch (err) {
        placeholder.textContent = "Generation failed. Please try again.";
        showError(err.message);
      } finally {
        spinner.style.display = "none";
        generateBtn.disabled = false;
        generateBtn.textContent = currentMode === "video" ? "Generate Video" : "Generate Image";
      }
    });
  </script>
</body>
</html>
