<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — VideoViaAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .contact-wrapper {
      flex: 1;
      padding: 7.5rem 0 5rem;
    }

    .contact-container {
      max-width: 620px;
      margin: 0 auto;
    }

    .contact-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .contact-header h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    .contact-header p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
    }

    .contact-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      color: var(--text-secondary);
      margin-bottom: 0.45rem;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.94rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-textarea {
      min-height: 135px;
      resize: vertical;
      line-height: 1.55;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--border-hover);
    }

    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      font-weight: 600;
      font-size: 0.96rem;
      margin-top: 0.25rem;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-banner {
      display: none;
      margin-top: 1.15rem;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .status-banner.success {
      display: block;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #6ee7b7;
    }

    .status-banner.error {
      display: block;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-dot"></span>
      VideoViaAI
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="generate.html">Studio</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html" style="color: #ffffff;">Contact</a>
    </div>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-secondary">Sign in</a>
      <a href="generate.html" class="btn btn-primary">Try Studio</a>
    </div>
  </nav>

  <main class="contact-wrapper">
    <div class="container">
      <div class="contact-container">
        <div class="contact-header">
          <h1>Get in <span class="iridescent-text">Touch</span></h1>
          <p>Have a question about VideoViaAI, pricing, or upcoming video features? Send us a message and we'll get back to you.</p>
        </div>

        <div class="contact-card">
          <form id="contact-form" action="https://formspree.io/f/xnpdojgv" method="POST">
            <!-- Spam protection honeypot (invisible to humans) -->
            <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" />

            <div class="form-group">
              <label for="name">Your Name</label>
              <input type="text" id="name" name="name" class="form-input" placeholder="Alex Morgan" required />
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
              <label for="topic">Topic</label>
              <select id="topic" name="topic" class="form-select">
                <option value="General Question">General Question</option>
                <option value="Pricing & Subscriptions">Pricing & Subscriptions</option>
                <option value="Technical Support">Technical Support</option>
                <option value="Business / Agency Inquiry">Business / Agency Inquiry</option>
              </select>
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" class="form-textarea" placeholder="Tell us how we can help..." required></textarea>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary submit-btn">
              Send Message
            </button>

            <div id="status-banner" class="status-banner"></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span>© 2026 VideoViaAI. All rights reserved.</span>
        <div style="display: flex; gap: 1.5rem;">
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const form = document.getElementById("contact-form");
    const submitBtn = document.getElementById("submit-btn");
    const statusBanner = document.getElementById("status-banner");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusBanner.className = "status-banner";
      statusBanner.textContent = "";

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" },
        });

        if (response.ok) {
          form.reset();
          statusBanner.className = "status-banner success";
          statusBanner.textContent = "Thanks for reaching out! Your message has been sent and we'll reply shortly.";
        } else {
          const data = await response.json().catch(() => ({}));
          const msg = data.errors ? data.errors.map((err) => err.message).join(", ") : "Could not send message. Please try again.";
          statusBanner.className = "status-banner error";
          statusBanner.textContent = msg;
        }
      } catch (err) {
        statusBanner.className = "status-banner error";
        statusBanner.textContent = "Network error. Please check your connection and try again.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Message";
      }
    });
  </script>

</body>
</html>
