<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — VideoViaAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8.5rem 5% 4rem;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 0.25rem;
      margin-bottom: 1.75rem;
    }

    .auth-tab {
      padding: 0.55rem;
      border: none;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: #ffffff;
      color: #000000;
    }

    .auth-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 1.15rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 0.45rem;
    }

    .form-input {
      width: 100%;
      padding: 0.78rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--border-hover);
    }

    .auth-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      font-weight: 600;
    }

    .auth-notice {
      display: none;
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #6ee7b7;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .auth-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--text-primary);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-dot"></span>
      VideoViaAI
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="generate.html">Studio</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="nav-actions">
      <a href="generate.html" class="btn btn-primary">Start creating</a>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="signin">Sign In</button>
        <button type="button" class="auth-tab" data-mode="signup">Create Account</button>
      </div>

      <h1 id="auth-heading">Welcome back</h1>
      <p class="auth-subtitle" id="auth-sub">Sign in to access your plan and generation history.</p>

      <form id="auth-form">
        <div class="form-group" id="name-group" style="display: none;">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="Your name" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">Sign In</button>
      </form>

      <div class="auth-notice" id="auth-notice"></div>

      <div class="auth-footer">
        By continuing, you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span>© 2026 VideoViaAI. All rights reserved.</span>
        <div style="display: flex; gap: 1.5rem;">
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    let authMode = "signin";
    const heading = document.getElementById("auth-heading");
    const sub = document.getElementById("auth-sub");
    const nameGroup = document.getElementById("name-group");
    const submitBtn = document.getElementById("submit-btn");
    const notice = document.getElementById("auth-notice");

    document.querySelectorAll(".auth-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".auth-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        authMode = tab.dataset.mode;
        notice.style.display = "none";

        if (authMode === "signup") {
          heading.textContent = "Create your account";
          sub.textContent = "Start free with 2 images and 1 video every day.";
          nameGroup.style.display = "block";
          submitBtn.textContent = "Create Free Account";
        } else {
          heading.textContent = "Welcome back";
          sub.textContent = "Sign in to access your plan and generation history.";
          nameGroup.style.display = "none";
          submitBtn.textContent = "Sign In";
        }
      });
    });

    document.getElementById("auth-form").addEventListener("submit", (e) => {
      e.preventDefault();
      // Firebase Authentication will be connected here in Phase 4
      notice.textContent =
        authMode === "signup"
          ? "Account system is in preview mode. You can already use the Studio for free without signing in!"
          : "Sign-in will activate once Firebase Auth is connected. Head to the Studio to try the free tier now.";
      notice.style.display = "block";
    });
  </script>
</body>
</html>
